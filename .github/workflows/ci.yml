name: Selenium Test Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip xvfb libxi6 libgconf-2-4
        
    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: "latest"

    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@v2
      with:
        chromedriver-version: "latest"

    - name: Show versions
      run: |
        google-chrome --version
        chromedriver --version
        python --version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create reports directory
      run: mkdir -p reports

    - name: Run Selenium tests
      env:
        BASE_URL: ${{ secrets.BASE_URL || 'https://www.saucedemo.com/' }}
        VALID_USERNAME: ${{ secrets.VALID_USERNAME || 'standard_user' }}
        VALID_PASSWORD: ${{ secrets.VALID_PASSWORD || 'secret_sauce' }}
        LOCKED_USER: ${{ secrets.LOCKED_USER || 'locked_out_user' }}
      run: |
        # Run tests with HTML report
        python -m pytest src/tests/test_login_logout.py -v \
          --html=reports/report.html \
          --self-contained-html \
          --junitxml=reports/junit.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          reports/*.html
          reports/*.xml
          screenshots/*.png
        if-no-files-found: warn
