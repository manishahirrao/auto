name: Selenium Test Pipeline - Enhanced Debugging

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget unzip xvfb libxi6 libxss1 libnss3 libasound2 libgbm1
        
    - name: Install Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo 'deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install ChromeDriver
      run: |
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
        echo "Chrome version: $CHROME_VERSION"
        CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
        echo "Chrome major version: $CHROME_MAJOR_VERSION"
        CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_MAJOR_VERSION")
        echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
        wget -q "https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip"
        unzip -q chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/chromedriver
        sudo chmod +x /usr/local/bin/chromedriver

    - name: Debug environment
      run: |
        echo "=== Environment Debug Information ==="
        echo "Python: $(python --version)"
        echo "Pip: $(pip --version)"
        echo "Chrome: $(google-chrome --version)"
        echo "ChromeDriver: $(chromedriver --version)"
        echo "Display: $DISPLAY"
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Files in src/tests/:"
        ls -la src/tests/
        echo "==================================="

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list

    - name: Create reports and screenshots directories
      run: |
        mkdir -p reports
        mkdir -p screenshots
        chmod -R 777 reports screenshots

    - name: Run Selenium tests
      env:
        BASE_URL: ${{ secrets.BASE_URL || 'https://www.saucedemo.com/' }}
        VALID_USERNAME: ${{ secrets.VALID_USERNAME || 'standard_user' }}
        VALID_PASSWORD: ${{ secrets.VALID_PASSWORD || 'secret_sauce' }}
        LOCKED_USER: ${{ secrets.LOCKED_USER || 'locked_out_user' }}
        PYTHONUNBUFFERED: 1
      run: |
        # Start Xvfb in the background
        Xvfb :99 -screen 0 1920x1080x16 &
        export DISPLAY=:99
        
        # Wait for Xvfb to start
        sleep 5
        
        # Run tests with detailed output
        set -x  # Enable debug output
        python -m pytest src/tests/test_login_logout.py -v \
          --maxfail=1 \
          --disable-warnings \
          --html=reports/report.html \
          --self-contained-html \
          --junitxml=reports/junit.xml \
          --show-capture=all \
          -rA \
          --log-cli-level=INFO
        
        # Capture the exit code
        TEST_EXIT_CODE=$?
        
        # List generated files
        echo "Generated files:"
        find reports -type f
        find screenshots -type f 2>/dev/null || echo "No screenshots found"
        
        # Exit with the test's exit code
        exit $TEST_EXIT_CODE

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          reports/
          screenshots/
        if-no-files-found: warn
        retention-days: 5
