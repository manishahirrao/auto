name: Selenium Test Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip xvfb libxi6
        
    - name: Install Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo 'deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install ChromeDriver
      run: |
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
        CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
        CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_MAJOR_VERSION")
        wget -q "https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip"
        unzip -q chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/chromedriver
        sudo chmod +x /usr/local/bin/chromedriver

    - name: Show versions
      run: |
        google-chrome --version
        chromedriver --version
        python --version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create reports and screenshots directories
      run: |
        mkdir -p reports
        mkdir -p screenshots

    - name: Run Selenium tests
      env:
        BASE_URL: ${{ secrets.BASE_URL || 'https://www.saucedemo.com/' }}
        VALID_USERNAME: ${{ secrets.VALID_USERNAME || 'standard_user' }}
        VALID_PASSWORD: ${{ secrets.VALID_PASSWORD || 'secret_sauce' }}
        LOCKED_USER: ${{ secrets.LOCKED_USER || 'locked_out_user' }}
      run: |
        # Set display for headless mode
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x16 &
        
        # Run tests with HTML report
        python -m pytest src/tests/test_login_logout.py -v \
          --html=reports/report.html \
          --self-contained-html \
          --junitxml=reports/junit.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          reports/*.html
          reports/*.xml
          screenshots/*.png
        if-no-files-found: warn
